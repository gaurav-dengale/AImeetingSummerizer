server.port=8080
spring.application.name=meeting-assistant-backend

# Python AI Microservice (FastAPI)
ai.service.url=http://127.0.0.1:5001

# Vexa API settings
vexa.api.key=${VEXA_API_KEY:}
vexa.base.url=${VEXA_BASE_URL:https://api.cloud.vexa.ai}

# Slack integration
slack.bot.token=${SLACK_BOT_TOKEN:}

# Contacts file path
contacts.csv.path=${CONTACTS_CSV_PATH:contacts.csv}

# Google OAuth Credentials
google.credentials.path=credentials.json
google.token.path=tokens

# ── PostgreSQL Datasource ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/meetingai
spring.datasource.username=postgres
spring.datasource.password=983483
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# update = auto-creates tables on first run, updates columns on schema changes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Feature: Confidence-Gated Auto-Dispatch ───────────────────────────────────
# Any task with confidence >= 50% auto-dispatches; vague tasks (<50%) go to review
dispatch.confidence.auto.threshold=50


# ── Feature: Recurring Digest ─────────────────────────────────────────────────
digest.schedule=OFF
digest.email=
digest.slack.channel=
