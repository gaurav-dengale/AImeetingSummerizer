server.port=8080
spring.application.name=meeting-assistant-backend

# Python AI Microservice (FastAPI)
ai.service.url=http://127.0.0.1:5001

# Vexa API settings
vexa.api.key=${VEXA_API_KEY:}
vexa.base.url=${VEXA_BASE_URL:https://api.cloud.vexa.ai}

# Slack integration
slack.bot.token=${SLACK_BOT_TOKEN:}

# Contacts file path
contacts.csv.path=${CONTACTS_CSV_PATH:contacts.csv}

# Google OAuth Credentials
google.credentials.path=credentials.json
